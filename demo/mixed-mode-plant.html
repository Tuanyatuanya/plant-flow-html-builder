<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEST 05 · MIXED-MODE PLANT — Material Flow</title>
<style>
:root{--shell:#102734;--panel:#153541;--rule:#365766;--ink:#f5fafc;--muted:#b7c8cf;--paper:#f4f7f6;--accent:#d9ed48}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--shell);color:var(--ink);font:14px/1.4 Inter,ui-sans-serif,system-ui,sans-serif}
header{height:58px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--rule)}h1{margin:0;border-left:4px solid var(--accent);padding-left:13px;font-size:19px;letter-spacing:.055em}
main{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:calc(100vh - 58px)}.stage{padding:12px;min-width:0}.map{height:calc(100vh - 82px);min-height:530px;background:var(--paper);border:1px solid #68818c;border-radius:5px;overflow:auto}.map svg{display:block;width:100%;height:100%;min-width:880px}
aside{padding:16px;border-left:1px solid var(--rule);background:#0d202a}aside section+section{margin-top:19px}h2{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:7px}.filter,.action{width:100%;margin:0 0 7px;padding:9px;border:1px solid #466b7b;border-radius:4px;background:#112b37;color:#fff;text-align:left;cursor:pointer}.filter[aria-pressed=true],.action.primary{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}.speed{display:grid;grid-template-columns:1fr 72px;gap:8px;align-items:center;margin:8px 0}.speed input{width:100%;padding:7px;border:1px solid #466b7b;border-radius:3px;background:#142f3b;color:#fff}.hint{font-size:11px;color:var(--muted)}
.boundary{fill:url(#grid);stroke:#526f7d;stroke-width:2}.zone{stroke:#526f7d;stroke-width:1.7}.map-label{font:16px Georgia,serif;fill:#172e3c;text-anchor:middle;dominant-baseline:middle}.flow{transition:opacity .2s}.flow.off{opacity:.035}.route-casing{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.flow-path{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.flow-dot{stroke:#fff;stroke-width:2}.labels.off{opacity:0}.flow-arrow{pointer-events:none}
@media(max-width:900px){main{grid-template-columns:1fr}.map{height:62vh}.map svg{width:auto}aside{border-left:0;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}aside section+section{margin-top:0}}@media(max-width:620px){aside{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.flow-dot{display:none}}
</style></head><body>
<header><h1>TEST 05 · MIXED-MODE PLANT</h1></header><main><section class="stage"><div class="map">
<svg id="flow-map" viewBox="0 0 1320 900" role="img" aria-label="TEST 05 mixed-mode plant layout and four material flows">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#f4f7f6"/><path d="M40 0H0V40" fill="none" stroke="#dfe7e6" stroke-width="1"/></pattern><marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0783cc"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#10a56f"/></marker><marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#df39aa"/></marker><marker id="arrow-f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f47a16"/></marker></defs>
<rect class="boundary" x="35" y="35" width="1235" height="820" rx="7"/>
<g class="zones">
<rect class="zone" data-zone-id="receiving-dock" x="80" y="90" width="240" height="120" rx="2" fill="#d4e6f7"/><rect class="zone" data-zone-id="machining" x="470" y="100" width="260" height="180" rx="2" fill="#dcf2e6"/><rect class="zone" data-zone-id="subassembly" x="800" y="100" width="300" height="180" rx="2" fill="#dcf2e6"/>
<rect class="zone" data-zone-id="raw-material-storage" x="80" y="300" width="300" height="260" rx="2" fill="#fff0bd"/><rect class="zone" data-zone-id="main-assembly" x="470" y="410" width="500" height="220" rx="2" fill="#d9f1f3"/><rect class="zone" data-zone-id="quality-gate" x="1030" y="430" width="190" height="120" rx="2" fill="#f3d8eb"/>
<rect class="zone" data-zone-id="returnable-wash" x="250" y="690" width="260" height="100" rx="2" fill="#e8ecee"/><rect class="zone" data-zone-id="finished-goods" x="850" y="700" width="300" height="100" rx="2" fill="#fff0bd"/><rect class="zone" data-zone-id="shipping" x="1190" y="680" width="100" height="120" rx="2" fill="#d4e6f7"/>
</g>
<g class="labels"><text class="map-label" x="200" y="150">RECEIVING DOCK</text><text class="map-label" x="600" y="190">MACHINING</text><text class="map-label" x="950" y="190">SUBASSEMBLY</text><text class="map-label" x="230" y="430">RAW MATERIAL STORAGE</text><text class="map-label" x="720" y="520">MAIN ASSEMBLY</text><text class="map-label" x="1125" y="490">QUALITY GATE</text><text class="map-label" x="380" y="740">RETURNABLE WASH</text><text class="map-label" x="1000" y="750">FINISHED GOODS</text><text class="map-label" x="1240" y="740">SHIPPING</text></g>
<g class="flow" data-layer="product-a"><path class="flow-path" data-route-id="product-a-main" data-source="receiving-dock" data-destination="main-assembly" data-waypoints="320,150;420,150;420,380;720,380;720,410" d="M320 150H420V380H720V410" stroke="#0783cc" marker-end="url(#arrow-a)"/></g>
<g class="flow" data-layer="product-b"><path class="flow-path" data-route-id="product-b-main" data-source="raw-material-storage" data-destination="quality-gate" data-waypoints="380,430;440,430;440,650;1000,650;1000,490;1030,490" d="M380 430H440V650H1000V490H1030" stroke="#10a56f" marker-end="url(#arrow-b)"/></g>
<g class="flow" data-layer="packaging-return"><path class="flow-path" data-route-id="packaging-return-main" data-source="shipping" data-destination="returnable-wash" data-waypoints="1190,750;1160,750;1160,830;200,830;200,740;250,740" d="M1190 750H1160V830H200V740H250" stroke="#df39aa" marker-end="url(#arrow-p)"/></g>
<g class="flow" data-layer="finished-goods-flow"><path class="flow-path" data-route-id="finished-goods-main" data-source="main-assembly" data-destination="finished-goods" data-waypoints="970,560;1000,560;1000,700" d="M970 560H1000V700" stroke="#f47a16" marker-end="url(#arrow-f)"/></g>
</svg></div></section>
<aside><section><h2>Flow display</h2><button class="filter" data-flow="all" aria-pressed="true">All flows</button><button class="filter" data-flow="product-a"><span class="swatch" style="background:#0783cc"></span>Product A</button><button class="filter" data-flow="product-b"><span class="swatch" style="background:#10a56f"></span>Product B</button><button class="filter" data-flow="packaging-return"><span class="swatch" style="background:#df39aa"></span>Packaging Return</button><button class="filter" data-flow="finished-goods-flow"><span class="swatch" style="background:#f47a16"></span>Finished Goods</button></section>
<section><h2>Flow speed</h2><div class="speed"><label for="a-speed">Product A</label><input id="a-speed" data-speed-layer="product-a" type="number" min="5" max="300" value="70"></div><div class="speed"><label for="b-speed">Product B</label><input id="b-speed" data-speed-layer="product-b" type="number" min="5" max="300" value="62"></div><div class="speed"><label for="p-speed">Packaging Return</label><input id="p-speed" data-speed-layer="packaging-return" type="number" min="5" max="300" value="82"></div><div class="speed"><label for="f-speed">Finished Goods</label><input id="f-speed" data-speed-layer="finished-goods-flow" type="number" min="5" max="300" value="48"></div><p class="hint">Distance units per second</p></section>
<section><h2>Controls</h2><button class="action primary" id="play">Pause</button><button class="action" id="labels">Labels: on</button><button class="action" id="reset">Reset</button></section></aside></main>
<script>
const defaultSpeeds={'product-a':70,'product-b':62,'packaging-return':82,'finished-goods-flow':48},speeds={...defaultSpeeds},layers=[...document.querySelectorAll('.flow')],movers=[];let active=new Set(layers.map(x=>x.dataset.layer)),running=true,elapsed=0,labelsOn=true;
layers.forEach(group=>group.querySelectorAll('.flow-path').forEach((path,pathIndex)=>{const casing=path.cloneNode(false);casing.setAttribute('class','route-casing');casing.removeAttribute('marker-end');group.insertBefore(casing,path);const length=path.getTotalLength(),count=length>500?5:3;for(let i=0;i<count;i++){const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('r','4.5');dot.setAttribute('fill',path.getAttribute('stroke'));dot.setAttribute('class','flow-dot');group.appendChild(dot);movers.push({path,dot,length,layer:group.dataset.layer,offset:i/count+pathIndex*.09})}}));
function render(){layers.forEach(x=>x.classList.toggle('off',!active.has(x.dataset.layer)));document.querySelectorAll('[data-flow]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.flow==='all'?active.size===layers.length:active.size===1&&active.has(b.dataset.flow))))}document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{active=new Set(b.dataset.flow==='all'?layers.map(x=>x.dataset.layer):[b.dataset.flow]);render()});document.querySelectorAll('[data-speed-layer]').forEach(i=>i.oninput=()=>{const v=Number(i.value);if(Number.isFinite(v)&&v>0)speeds[i.dataset.speedLayer]=Math.min(300,Math.max(5,v))});
document.getElementById('play').onclick=e=>{running=!running;e.currentTarget.textContent=running?'Pause':'Play'};document.getElementById('labels').onclick=e=>{labelsOn=!labelsOn;document.querySelector('.labels').classList.toggle('off',!labelsOn);e.currentTarget.textContent=labelsOn?'Labels: on':'Labels: off'};document.getElementById('reset').onclick=()=>{active=new Set(layers.map(x=>x.dataset.layer));running=true;labelsOn=true;elapsed=0;Object.entries(defaultSpeeds).forEach(([id,v])=>{speeds[id]=v;document.querySelector(`[data-speed-layer="${id}"]`).value=v});document.querySelector('.labels').classList.remove('off');document.getElementById('play').textContent='Pause';document.getElementById('labels').textContent='Labels: on';render()};let last=performance.now();function animate(now){const delta=Math.min((now-last)/1000,.05);last=now;if(running)elapsed+=delta;movers.forEach(m=>{const p=(elapsed*speeds[m.layer]/m.length+m.offset)%1,pt=m.path.getPointAtLength(p*m.length);m.dot.setAttribute('cx',pt.x);m.dot.setAttribute('cy',pt.y)});requestAnimationFrame(animate)}render();requestAnimationFrame(animate);
</script></body></html>
